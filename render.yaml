services:
  - type: worker
    name: anishiroxbot
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: anishiroxbot-db
          property: connectionString
      - key: REDIS_URL
        sync: false
      - key: MAIN_CHANNEL_ID
        sync: false
      - key: MAIN_CHANNEL_USERNAME
        sync: false
      - key: REQUIRED_CHANNELS
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_API_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEFAULT_LANGUAGE
        value: uz

databases:
  - name: anishiroxbot-db
    plan: starter
    databaseName: anishiroxbot
    user: anishirox
